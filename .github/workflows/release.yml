name: Release App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.16.5)"
        required: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (universal)
            rust_targets: x86_64-apple-darwin,aarch64-apple-darwin
            tauri_args: --target universal-apple-darwin
          - os: windows-latest
            label: Windows (x64)
            rust_targets: x86_64-pc-windows-msvc
            tauri_args: ""
          - os: ubuntu-22.04
            label: Linux (x64)
            rust_targets: x86_64-unknown-linux-gnu
            tauri_args: ""
            # wry 0.24.7 + webkit2gtk crate ABI 漂移导致 Linux 构建挂掉，
            # 不阻塞 macOS/Windows release，等升 Tauri 后再尝试恢复。
            allow_failure: true
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure == true }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsoup2.4-dev \
            libjavascriptcoregtk-4.0-dev \
            patchelf

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: "NextChat ${{ steps.tag.outputs.tag }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.tauri_args }}
